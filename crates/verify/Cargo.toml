[package]
name = "verify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# Repository tooling, not a library: the harness only has meaning next to the
# corpus and the CI scripts it drives, neither of which is a package.
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: helper JSON carries f64 geometry whose exact values
# feed placement CSVs; the default lossy float parse can be 1 ULP off,
# which shifts written /Rect digits.
serde_json = { version = "1", features = ["float_roundtrip"] }
