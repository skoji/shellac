[package]
name = "shellac"
version = "0.1.0"
# Deliberately not on the workspace's 2024 edition: this crate's FFI surface
# uses the pre-2024 `#[no_mangle]` / `unsafe extern` forms. Moving to 2024 is
# a separate, reviewable change.
edition = "2021"
license.workspace = true
description = "Incremental-save PDF annotation engine: appends annotation edits as one incremental update, leaving the original bytes untouched"
repository = "https://github.com/skoji/shellac"
readme = "README.md"
keywords = ["pdf", "annotations", "incremental-save", "lopdf", "ffi"]
categories = ["text-processing"]
# The package is the engine and nothing else. The corpus, the harness and the
# CI scripts are how it is verified, not what a consumer links against, and
# the corpus alone is tens of megabytes of PDF.
include = [
    "src/**",
    "build.rs",
    "cbindgen.toml",
    "include/shellac.h",
    "README.md",
    "LICENSE",
]

[lib]
name = "shellac"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "shellac-cli"
path = "src/bin/shellac_cli.rs"

[dependencies]
lopdf = "0.44.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cbindgen = "0.27"

# Note: the release profile is intentionally left at cargo defaults, both here
# and at the workspace root. `panic = "abort"` MUST NOT be set — see the
# rationale in the workspace `Cargo.toml`.
