language = "C"
pragma_once = true
include_guard = "SHELLAC_H"
header = "/* Generated by cbindgen. Do not edit. */"
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
style = "type"

[export]
include = [
    "shellac_apply_ops",
    "shellac_can_open",
    "shellac_free_string",
]

[parse]
parse_deps = false
